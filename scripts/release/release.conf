# Release pipeline constants shared by scripts/release/*.sh and *.py.
# KEY=VALUE lines only: no quoting, no variable expansion.
APP_NAME=AnyDoor
BUNDLE_ID=dev.bybee.AnyDoor
APPLE_TEAM_ID=9VM4RM39R3
DEFAULT_REPOSITORY=ZingerLittleBee/AnyDoor
FEED_URL=https://anydoor.dev/appcast.xml
# Must agree with Package.swift's .macOS platform and Info.plist's
# LSMinimumSystemVersion; meta.py verify-plist asserts all three.
MIN_MACOS=14.0
# Must agree with the Sparkle pin in Package.resolved. The digest is the
# official release tarball's (also published as the GitHub asset digest).
SPARKLE_VERSION=2.9.2
SPARKLE_TARBALL_SHA256=1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95
# generate_appcast keeps this many items per update branch (its own default).
APPCAST_MAX_VERSIONS=3
# The last Release published by the old local flow, whose appcast.xml has no
# Sparkle feed signature. seed-feed.sh accepts an unsigned seed only from this
# Release (or from --from-git), and only after every enclosure's EdDSA signature
# verifies. Every other seed must carry a feed signature from the pinned key.
LEGACY_UNSIGNED_FEED_TAG=v4.2.7
