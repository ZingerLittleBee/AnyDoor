name: Landing

# Rebuild and deploy the marketing landing page only for a published Stable
# release. Beta prereleases update the independent appcast route instead.
#
# A pull request that touches landing/ runs the same build without deploying, so
# a broken site surfaces on the PR instead of during a release.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# Avoid overlapping deploys; let the newest tag win.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Stable release metadata
        run: bun test

      - name: Build
        if: github.event_name == 'pull_request'
        run: bun run build

      # `bun run deploy` builds and then deploys, so the two paths are mutually
      # exclusive rather than building twice.
      - name: Build and deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
