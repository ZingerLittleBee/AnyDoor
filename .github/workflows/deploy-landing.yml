name: Landing

# This Actions path deploys for published Stable releases or manual dispatch.
# Cloudflare Workers Builds can independently deploy production-branch pushes;
# inspect its live configuration before merging landing changes (docs/deployment.md).
# Beta prereleases update the independent appcast route instead.
#
# A pull request that touches landing/ runs the same build without deploying, so
# a broken site surfaces on the PR instead of during a release.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

# Serialize Stable deploys so the newest Stable tag wins. Prerelease workflow
# runs use their own ref group and therefore cannot cancel a Stable deploy
# before the prerelease-only job guard skips them.
concurrency:
  group: landing-${{ github.event_name == 'release' && github.event.release.prerelease == false && 'deploy' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Stable release metadata
        run: bun test

      - name: Build
        if: github.event_name == 'pull_request'
        run: bun run build

      # `bun run deploy` builds and then deploys, so the two paths are mutually
      # exclusive rather than building twice.
      - name: Build and deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
