name: CI

# The one gate every pull request has to pass. release.yml also calls this
# workflow on the tag commit, so a red suite blocks a tag-triggered release.
#
# Changes that cannot affect the Swift build or the tooling workspace skip the
# whole workflow (a run happens only when some changed file falls outside this
# list). Root-level `*.md` only: tooling READMEs ship in the scaffold template.
# None of these jobs is a required check; if one becomes required, move this
# filtering into the jobs so a skipped job reports success instead of leaving
# the required check pending forever.
on:
  push:
    # Beta release branches too: scripts/release/cut.py refuses to tag a HEAD
    # without a green push run.
    branches: [main, 'release/*-beta']
    paths-ignore: &docs-and-meta
      - '*.md'
      - 'docs/**'
      - 'landing/**'
      - 'feed/**'
      - 'video/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
      - '.github/zizmor.yml'
      - '.github/actionlint.yaml'
      - '.github/scripts/**'
      - '.github/workflows/check-commit-attribution.yml'
      - '.github/workflows/deploy-*.yml'
      - '.github/workflows/workflow-lint.yml'
      - '.gitignore'
      - 'lefthook.yml'
  pull_request:
    paths-ignore: *docs-and-meta
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-universal:
        description: Skip the universal release build (the caller builds release binaries itself).
        type: boolean
        default: false

# A called workflow sees its caller's name in github.workflow, so a release
# run's test gate cannot cancel (or be cancelled by) the regular CI run on the
# same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (debug, arm64)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .github/macos-toolchain.env owns the Xcode pin; the action fails if
      # this runner image no longer ships that exact build.
      - name: Set up the pinned toolchain
        uses: ./.github/actions/setup-macos-toolchain

      # Cache only SwiftPM's clone/manifest cache — never `.build`. A restored
      # `.build` would skip recompiling unchanged modules, and the warning gate
      # below only sees warnings that are actually re-emitted.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build (first-party warnings are errors)
        run: bash scripts/check-swift.sh --build-only

      # TranslationKeychainStore's tests write real kSecClassGenericPassword
      # items to the default keychain. A headless runner's login keychain may be
      # locked, which makes SecItemAdd fail with errSecInteractionNotAllowed, so
      # point the session at a throwaway unlocked keychain instead.
      - name: Prepare a throwaway default keychain
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 7200 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain

      - name: Test
        run: bash scripts/check-swift.sh --skip-build

  tooling:
    name: Script Plugin tooling
    # `pnpm verify` builds the authoring API, the scaffold template and both
    # worked examples, and fails when the committed Swift/TS contract fixture no
    # longer matches its typed source — a staleness check the Swift tests cannot
    # do, since they only decode the committed JSON. Plain Node, so it runs on
    # Linux alongside the macOS job instead of gating it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tooling
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tooling/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  release-tools:
    name: Release tooling unit tests
    # scripts/release/** unit tests. macOS-only cases (PlistBuddy, hdiutil,
    # codesign) skip here; the release rehearsal exercises them on macOS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Test
        run: uv run --locked --project scripts/release python -m unittest discover -s scripts/release/tests

  universal-build:
    name: Universal release build (arm64 + x86_64)
    # Builds and assembles the app with the release scripts and parameters.
    # The debug job only compiles arm64, so the x86_64 halves of every
    # `#if arch(arm64)` else-branch (the Intel DDC brightness backend, most
    # notably) are type-checked nowhere else until release day. Too slow for
    # every PR, cheap once per merge. A release run skips it: release-build.yml
    # builds the same thing on the tag.
    if: github.event_name != 'pull_request' && !inputs.skip-universal
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned toolchain
        uses: ./.github/actions/setup-macos-toolchain

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Build
        run: scripts/release/build.sh

      - name: Assemble
        run: scripts/release/assemble.sh --out dist
