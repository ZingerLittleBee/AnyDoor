version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new action release age before adopting it, so a compromised
    # release is more likely to be caught upstream first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
